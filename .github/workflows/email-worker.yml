# Background email worker for the free deployment (Render's free tier blocks outbound SMTP).
# Every 30 minutes (and on demand via "Run workflow"), runs `worker:once`: it exits within seconds when
# nothing is due, otherwise sends due emails over Ethereal SMTP, posts Slack alerts, and exits when idle.
# Secrets live in GitHub encrypted secrets; nothing sensitive is printed.
name: Email worker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never run two workers from this workflow at once, and never cancel a run mid-send.
# (Overlap would still be safe — BullMQ locks + DB claims — this just avoids wasted minutes.)
concurrency:
  group: email-worker
  cancel-in-progress: false

jobs:
  process-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # No Elasticsearch on the free stack: an unreachable URL makes the worker skip search sync.
      ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL || 'http://127.0.0.1:9200' }}
      WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY || '5' }}
      MIN_EMAIL_DELAY_MS: ${{ vars.MIN_EMAIL_DELAY_MS || '2000' }}
      MAX_EMAILS_PER_HOUR_PER_SENDER: ${{ vars.MAX_EMAILS_PER_HOUR_PER_SENDER || '200' }}
      WORKER_ONCE_MAX_MS: '600000'
    steps:
      - name: Wake the API on Render (best effort)
        if: ${{ vars.API_HEALTH_URL != '' }}
        run: curl -fsS --max-time 90 "$API_HEALTH_URL" > /dev/null || echo "API did not respond; continuing"
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build (prisma generate + tsc)
        working-directory: backend
        run: npm run build

      - name: Process due jobs, then exit
        working-directory: backend
        run: npm run worker:once
